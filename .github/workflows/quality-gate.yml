name: Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen --no-dev --package odap
      - run: uv run ruff check apps/api/odap tests/

  architecture-contracts:
    name: Architecture Contracts (C1-C4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen --no-dev --package odap
      # C1/C2/C3 已烧至零 ignore（完全严格），C4 是 10 条只减不增的棘轮债账。
      # 新增 infra→biz 直接导入、common→上层导入、biz/infra→web 导入，
      # 或绕过 ontology public 门面的深层 reach-in，都会在这里 FAIL。
      #
      # 两条命令都是承重项（详见 ci.yml 同名步骤的注释）：
      # 1) import-linter / grimp 在仓库根 [dependency-groups] dev，上面的 --no-dev --package odap
      #    不装它们，且从 apps/api 执行 uv run 解析到 odap 项目、闭包同样不含 —— 必须在根补装。
      #    --inexact 防止精确 sync 把刚装好的 odap 当外来包卸掉（根项目无 [project.dependencies]）。
      # 2) lint-imports 必须在 apps/api 下跑：[tool.importlinter] 在 apps/api/pyproject.toml，
      #    从仓库根执行会报 "Could not read any configuration" 并退出码 1。
      - name: Verify layering contracts
        run: |
          uv sync --frozen --inexact
          cd apps/api && uv run --frozen --no-sync lint-imports

  backend-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen --no-dev --package odap
      - run: uv run pytest tests/unit/ apps/api/tests/ -v --tb=short

  frontend-lint:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'pnpm'
      - working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - working-directory: apps/web
        run: pnpm lint
      - name: Typecheck (non-blocking until M1)
        continue-on-error: true
        working-directory: apps/web
        run: pnpm typecheck

  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'pnpm'
      - working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - working-directory: apps/web
        run: pnpm test --run

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'pnpm'
      - working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - working-directory: apps/web
        run: pnpm build

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen --no-dev --package odap
      - run: uv run pytest tests/integration/ -v -m integration --tb=short

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, architecture-contracts]
    if: always()
    steps:
      - name: Check gate status
        run: |
          echo "Backend test: ${{ needs.backend-test.result }}"
          echo "Frontend build: ${{ needs.frontend-build.result }}"
          echo "Architecture contracts: ${{ needs.architecture-contracts.result }}"
          if [[ "${{ needs.backend-test.result }}" == "failure" || "${{ needs.frontend-build.result }}" == "failure" || "${{ needs.architecture-contracts.result }}" == "failure" ]]; then
            echo "::error::Quality gate failed"
            exit 1
          fi
          echo "Quality gate passed"
