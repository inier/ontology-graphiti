name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

      neo4j:
        image: neo4j:5.0
        ports:
          - 7687:7687
          - 7474:7474

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=odap --cov-report=xml

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v
        env:
          MONGODB_URI: mongodb://localhost:27017
          NEO4J_URI: bolt://localhost:7687

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run type check
        # M5 fix: 移除 || true，改为 continue-on-error 以暴露类型错误但不阻塞 CI。
        # 类型错误属于 M1（前端 any 专项治理，P2）范畴，待 M1 完成后移除 continue-on-error。
        continue-on-error: true
        run: |
          cd frontend
          npm run typecheck

      - name: Run linter
        run: |
          cd frontend
          npm run lint

      - name: Run unit tests
        run: |
          cd frontend
          npm test -- --watchAll=false

  build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          docker build -t graphiti:latest -f docker/Dockerfile .

      - name: Run Docker Compose
        run: |
          cd docker
          docker-compose up -d

      - name: Health check
        run: |
          sleep 10
          curl -f http://localhost:8000/health || exit 1