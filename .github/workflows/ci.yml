name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5
        ports:
          - 7687:7687
          - 7474:7474
        env:
          NEO4J_AUTH: neo4j/test123
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test123 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"

      - name: Verify lock file consistency
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --no-dev --package odap

      - name: Run ruff lint
        # 历史代码有 1500+ lint 错误，先作为非阻塞检查，等清理后改为阻塞
        continue-on-error: true
        run: uv run ruff check apps/api/odap apps/api/tests/

      - name: Verify architecture contracts (import-linter C1-C4)
        # 阻塞门禁，与上面 ruff 的 continue-on-error 刻意相反：分层契约一旦回退必须挡在合入前。
        # C1/C2/C3 已烧至零 ignore（完全严格），C4 是 10 条只减不增的棘轮债账。
        # 新增任何 infra→biz 直接导入、common→上层导入、biz/infra→web 导入、
        # 或绕过 ontology public 门面的深层 reach-in，都会在这里 FAIL。
        #
        # 下面两条命令都是承重项，不可合并、不可省：
        # 1) import-linter / grimp 声明在仓库根的 [dependency-groups] dev，上面的
        #    `uv sync --no-dev --package odap` 不会装它们；而从 apps/api 执行 `uv run`
        #    解析到的是 odap 项目，其依赖闭包同样不含（实测 inexact dry-run 只补 pytest，
        #    不补 grimp / import-linter）。故必须在仓库根补一次 dev 组。用 --inexact 是因为
        #    根项目 odap-monorepo 没有 [project.dependencies]，精确 sync 会把刚装好的 odap
        #    当外来包卸掉，导致 grimp 找不到 root_packages 里的 odap。
        # 2) lint-imports 必须在 apps/api 下执行：[tool.importlinter] 在 apps/api/pyproject.toml，
        #    从仓库根跑会报 "Could not read any configuration" 并以退出码 1 结束。
        #    --no-sync 避免 uv run 的隐式 inexact sync 再动一次环境。
        run: |
          uv sync --frozen --inexact
          cd apps/api && uv run --frozen --no-sync lint-imports

      - name: Run unit tests
        run: uv run pytest apps/api/tests/unit/ -v --cov=odap --cov-report=xml

      - name: Run integration tests
        run: |
          uv run pytest apps/api/tests/integration/ -v
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test123

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Run type check
        continue-on-error: true
        working-directory: apps/web
        run: pnpm typecheck

      - name: Run linter
        working-directory: apps/web
        run: pnpm lint

      - name: Run unit tests
        working-directory: apps/web
        run: pnpm test --run

  build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Docker image
        run: |
          docker build -t graphiti:latest -f docker/Dockerfile .

      - name: Run Docker Compose
        run: |
          docker compose -f docker/docker-compose.yml up -d

      - name: Health check
        run: |
          sleep 10
          curl -f http://localhost:8000/health || exit 1
