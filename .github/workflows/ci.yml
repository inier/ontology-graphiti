name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5
        ports:
          - 7687:7687
          - 7474:7474
        env:
          NEO4J_AUTH: neo4j/test123
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test123 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"

      - name: Verify lock file consistency
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --no-dev --package odap

      - name: Run ruff lint
        # 历史代码有 1500+ lint 错误，先作为非阻塞检查，等清理后改为阻塞
        continue-on-error: true
        run: uv run ruff check apps/api/odap apps/api/tests/

      - name: Run unit tests
        run: uv run pytest apps/api/tests/unit/ -v --cov=odap --cov-report=xml

      - name: Run integration tests
        run: |
          uv run pytest apps/api/tests/integration/ -v
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test123

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Run type check
        continue-on-error: true
        working-directory: apps/web
        run: pnpm typecheck

      - name: Run linter
        working-directory: apps/web
        run: pnpm lint

      - name: Run unit tests
        working-directory: apps/web
        run: pnpm test --run

  build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Docker image
        run: |
          docker build -t graphiti:latest -f docker/Dockerfile .

      - name: Run Docker Compose
        run: |
          docker compose -f docker/docker-compose.yml up -d

      - name: Health check
        run: |
          sleep 10
          curl -f http://localhost:8000/health || exit 1
