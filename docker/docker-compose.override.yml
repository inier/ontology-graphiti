# 开发环境覆盖配置 — fallback 模式
# 仅当 docker-compose.dev.yml 不存在时，与 docker-compose.yml 叠加使用
# 正常情况应使用独立的 docker-compose.dev.yml（单文件，完全隔离）

services:
  app:
    image: localhost/docker_app:latest
    container_name: graphiti-dev-app
    ports:
      - "8000:8000"
    env_file:
      - ../.env.docker
    environment:
      - IN_DOCKER=true
      - ENVIRONMENT=development
      - NEO4J_URI=bolt://graphiti-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j123456
      - OPA_URL=http://graphiti-policy-service:8181
      - REDIS_URL=redis://graphiti-cache:6379
      - MINIO_ENDPOINT=graphiti-minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_SECURE=false
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://localhost:8000
    depends_on:
      - graphiti-neo4j
      - graphiti-policy-service
      - graphiti-cache
      - graphiti-minio
    volumes:
      - ../app:/app/app
      - ../odap:/app/odap
      - ../main.py:/app/main.py
      - ../data:/app/data
    networks:
      - graphiti-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["python", "-m", "uvicorn", "odap.web.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    image: localhost/docker_frontend:dev
    container_name: graphiti-dev-frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend/package.json:/app/package.json
      - ../frontend/pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ../frontend/.npmrc:/app/.npmrc
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/index.html:/app/index.html
      - ../frontend/vite.config.ts:/app/vite.config.ts
      - ../frontend/tsconfig.json:/app/tsconfig.json
      - ../frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ../frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ../frontend/.env.development:/app/.env.development
      - ../frontend/.env.production:/app/.env.production
    environment:
      - NODE_ENV=development
      - VITE_API_BASE=
      - PROXY_TARGET=http://app:8000
    networks:
      - graphiti-network
    restart: unless-stopped
    command: ["sh", "-c", "pnpm install --frozen-lockfile 2>&1 | tail -3; pnpm dev --host 0.0.0.0"]
