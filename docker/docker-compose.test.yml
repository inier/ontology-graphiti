"""
Docker Compose 测试配置
ODAP 集成测试环境
"""

version: '3.8'

services:
  # Neo4j 图数据库
  test-neo4j:
    image: neo4j:5
    container_name: odap-test-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/test123
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - test-neo4j-data:/data
      - ./test-neo4j-plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "test123", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - odap-test-network

  # OPA 策略服务
  test-opa:
    image: openpolicyagent/opa:0.58.0
    container_name: odap-test-opa
    ports:
      - "8181:8181"
    command: run --server --log-level=info --set=decision_logs.console=true
    volumes:
      - ./opa-policies:/policies
      - ./opa-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - odap-test-network

  # Redis 缓存
  test-redis:
    image: redis:7-alpine
    container_name: odap-test-redis
    ports:
      - "6379:6379"
    volumes:
      - test-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - odap-test-network

  # PostgreSQL (用于审计日志)
  test-postgres:
    image: postgres:15-alpine
    container_name: odap-test-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=odap_test
      - POSTGRES_USER=odap
      - POSTGRES_PASSWORD=odap_test
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odap"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - odap-test-network

  # 测试应用
  test-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: odap-test-app
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://test-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=test123
      - OPA_URL=http://test-opa:8181
      - REDIS_URL=redis://test-redis:6379
      - POSTGRES_URI=postgresql://odap:odap_test@test-postgres:5432/odap_test
      - USE_DOCKER=true
    depends_on:
      test-neo4j:
        condition: service_healthy
      test-opa:
        condition: service_healthy
      test-redis:
        condition: service_healthy
      test-postgres:
        condition: service_healthy
    volumes:
      - ..:/app
    command: pytest tests/ -v --tb=short
    networks:
      - odap-test-network

volumes:
  test-neo4j-data:
  test-redis-data:
  test-postgres-data:

networks:
  odap-test-network:
    driver: bridge