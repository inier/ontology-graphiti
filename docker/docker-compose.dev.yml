# 开发环境专用 compose — 与生产环境完全隔离
# 启动: python bootstep.py dev
# 停止: python bootstep.py down
#
# 命名规范:
#   容器名:     graphiti-dev-{service}    (所有 dev 容器统一 dev 前缀)
#   生产容器名: graphiti-{service}        (prod 不使用 -dev 前缀)
#   Service 名: 保持与生产一致             (保证内部 DNS 解析不变)
#
# 与 docker-compose.yml (生产) 的区别:
#   1. 无 nginx 静态前端，改用 Vite dev server (5173)
#   2. 后端 bind mount 源代码 + uvicorn --reload
#   3. 数据持久化用 bind mount (../data) 而非 named volume

services:
  app:
    image: localhost/docker_app:latest
    container_name: graphiti-dev-app
    ports:
      - "8000:8000"
    env_file:
      - ../.env.docker
    environment:
      - IN_DOCKER=true
      - ENVIRONMENT=development
      - NEO4J_URI=bolt://graphiti-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j123456
      - OPA_URL=http://graphiti-policy-service:8181
      - REDIS_URL=redis://graphiti-cache:6379
      - MINIO_ENDPOINT=graphiti-minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_SECURE=false
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://localhost:8000
    depends_on:
      - graphiti-neo4j
      - graphiti-policy-service
      - graphiti-cache
      - graphiti-minio
    volumes:
      - ../apps/api/odap:/app/apps/api/odap
      - ../apps/api/main.py:/app/apps/api/main.py
      - ../packages/openharness:/app/packages/openharness
      - ../packages/hyper-extract:/app/packages/hyper-extract
      - ../data:/app/data
    working_dir: /app/apps/api
    networks:
      - graphiti-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["python", "-m", "uvicorn", "odap.web.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/apps/api/odap"]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    image: localhost/docker_frontend:dev
    container_name: graphiti-dev-frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend/package.json:/app/package.json
      - ../frontend/pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ../frontend/.npmrc:/app/.npmrc
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/index.html:/app/index.html
      - ../frontend/vite.config.ts:/app/vite.config.ts
      - ../frontend/tsconfig.json:/app/tsconfig.json
      - ../frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ../frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ../frontend/.env.development:/app/.env.development
      - ../frontend/.env.production:/app/.env.production
    environment:
      - NODE_ENV=development
      - VITE_API_BASE=
      - PROXY_TARGET=http://graphiti-dev-app:8000
    networks:
      - graphiti-network
    restart: unless-stopped
    command: ["sh", "-c", "pnpm install --frozen-lockfile 2>&1 | tail -3; pnpm dev --host 0.0.0.0"]

  graphiti-neo4j:
    image: localhost/neo4j:latest
    container_name: graphiti-dev-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/neo4j123456
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - graphiti-network
    restart: unless-stopped

  graphiti-policy-service:
    image: localhost/openpolicyagent/opa:0.58.0
    container_name: graphiti-dev-opa
    ports:
      - "8181:8181"
    volumes:
      - ../apps/api/odap/infra/opa/policies:/policies
    command: run --server --log-level=info --set=decision_logs.console=true /policies
    networks:
      - graphiti-network
    restart: unless-stopped

  graphiti-minio:
    image: localhost/minio:latest
    container_name: graphiti-dev-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - graphiti-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  graphiti-cache:
    image: localhost/redis:6
    container_name: graphiti-dev-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - graphiti-network
    restart: unless-stopped

volumes:
  neo4j-data:
  neo4j-logs:
  redis-data:
  minio_data:

networks:
  graphiti-network:
    driver: bridge
