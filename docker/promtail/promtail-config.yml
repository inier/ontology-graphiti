server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: odap_audit
    static_configs:
      - targets: [localhost]
        labels:
          job: odap_audit
          __path__: /var/log/odap/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: timestamp
            action: action
            actor_id: actor_id
            service: service
            result_status: result_status
            trace_id: trace_id
      - labels:
          level:
          service:
          result_status:
