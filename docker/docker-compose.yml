services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: graphiti-main-app
    ports:
      - "8000:8000"
    env_file:
      - ../.env.docker
    environment:
      - IN_DOCKER=true
      - NEO4J_URI=bolt://graphiti-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j123456
      - OPA_URL=http://graphiti-policy-service:8181
      - REDIS_URL=redis://graphiti-cache:6379
      - MONGODB_URI=mongodb://graphiti-mongodb:27017
      - CORS_ORIGINS=http://localhost:5173,http://localhost:8000,http://localhost:80
    depends_on:
      - graphiti-neo4j
      - graphiti-policy-service
      - graphiti-cache
      - graphiti-mongodb
    volumes:
      - app-data:/app/data
    networks:
      - graphiti-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: graphiti-frontend
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - graphiti-network
    restart: unless-stopped

  graphiti-neo4j:
    image: localhost/neo4j:latest
    container_name: graphiti-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/neo4j123456
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j-data:/data
    networks:
      - graphiti-network
    restart: unless-stopped

  graphiti-policy-service:
    image: localhost/openpolicyagent/opa:0.58.0
    container_name: graphiti-policy-service
    ports:
      - "8181:8181"
    volumes:
      - ../odap/infra/opa:/policies
    command: run --server --log-level=info --set=decision_logs.console=true /policies
    networks:
      - graphiti-network
    restart: unless-stopped

  graphiti-cache:
    image: localhost/redis:6
    container_name: graphiti-cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - graphiti-network
    restart: unless-stopped

  graphiti-mongodb:
    image: localhost/mongo:latest
    container_name: graphiti-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - graphiti-network
    restart: unless-stopped

volumes:
  neo4j-data:
  redis-data:
  mongodb-data:
  app-data:

networks:
  graphiti-network:
    driver: bridge
