services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: graphiti-main-app
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://graphiti-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j123456
      - OPA_URL=http://graphiti-policy-service:8181
      - REDIS_URL=redis://graphiti-cache:6379
      - MONGODB_URI=mongodb://graphiti-mongodb:27017
      - CORS_ORIGINS=http://localhost:5173,http://localhost:8000
      - DDG_API_URL=http://graphiti-duckduckgo:8080
    depends_on:
      - graphiti-neo4j
      - graphiti-policy-service
      - graphiti-cache
      - graphiti-mongodb
      - graphiti-duckduckgo
    volumes:
      - ..:/app
    networks:
      - graphiti-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  graphiti-neo4j:
    image: neo4j:latest
    container_name: graphiti-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/neo4j123456
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j-data:/data
    networks:
      - graphiti-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  graphiti-policy-service:
    image: openpolicyagent/opa:0.58.0
    container_name: graphiti-policy-service
    ports:
      - "8181:8181"
    volumes:
      - ../odap/infra/opa/policies:/policies
    command: run --server --log-level=info --set=decision_logs.console=true
    networks:
      - graphiti-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  graphiti-duckduckgo:
    image: hub.binjie.site:7777/binjie09/duckduckgo-api
    container_name: graphiti-duckduckgo
    ports:
      - "8080:8000"
    environment:
      - http_proxy=http://192.168.1.14:7890
      - https_proxy=http://192.168.1.14:7890
    networks:
      - graphiti-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  graphiti-cache:
    image: redis:6
    container_name: graphiti-cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - graphiti-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  graphiti-mongodb:
    image: mongo:latest
    container_name: graphiti-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - graphiti-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

volumes:
  neo4j-data:
  redis-data:
  mongodb-data:

networks:
  graphiti-network:
    driver: bridge