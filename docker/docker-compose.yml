services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: graphiti-main-app
    ports:
      - "8000:8000"
    env_file:
      - ../.env.docker
    environment:
      - IN_DOCKER=true
      - NEO4J_URI=bolt://graphiti-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j123456
      - OPA_URL=http://graphiti-policy-service:8181
      - REDIS_URL=redis://graphiti-cache:6379
      - MINIO_ENDPOINT=graphiti-minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://localhost:8000
    depends_on:
      - graphiti-neo4j
      - graphiti-policy-service
      - graphiti-cache
      - graphiti-minio
    volumes:
      - app-data:/app/data
    networks:
      - graphiti-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: graphiti-frontend
    ports:
      - "8080:80"
    depends_on:
      - app
    networks:
      - graphiti-network
    restart: unless-stopped

  graphiti-neo4j:
    image: localhost/neo4j:latest
    container_name: graphiti-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/neo4j123456
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - graphiti-network
    restart: unless-stopped

  graphiti-policy-service:
    image: localhost/openpolicyagent/opa:0.58.0
    container_name: graphiti-policy-service
    ports:
      - "8181:8181"
    volumes:
      - ../apps/api/odap/infra/opa/policies:/policies
    command: run --server --log-level=info --set=decision_logs.console=true /policies
    networks:
      - graphiti-network
    restart: unless-stopped

  graphiti-minio:
    image: localhost/minio:latest
    container_name: graphiti-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - graphiti-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  graphiti-cache:
    image: localhost/redis:6
    container_name: graphiti-cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - graphiti-network
    restart: unless-stopped

  # Crawl4AI JS 渲染爬取服务（独立容器，避免主容器镜像膨胀）
  # 启用前需先构建镜像：podman build -t localhost/crawl4ai -f docker/Dockerfile.crawl4ai .
  # 启动方式：python bootstep.py dev --profile data-collection
  crawl4ai:
    profiles: ["data-collection"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.crawl4ai
    image: localhost/crawl4ai:latest
    container_name: graphiti-crawl4ai
    ports:
      - "8020:8020"
    environment:
      - CHROME_BIN=/usr/bin/chromium
      - CHROMIUM_PATH=/usr/bin/chromium
      - CRAWL4AI_API_URL=http://graphiti-crawl4ai:8020
    networks:
      - graphiti-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import crawl4ai; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G

  # Browser-Use MCP Server（AI 驱动浏览器自动化）
  # 启用前需先构建镜像：podman build -t localhost/browser-use -f docker/Dockerfile.browser-use .
  # 启动方式：python bootstep.py dev --profile data-collection
  browser-use-mcp:
    profiles: ["data-collection"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.browser-use
    image: localhost/browser-use:latest
    container_name: graphiti-browser-use
    ports:
      - "8030:8030"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - CHROME_BIN=/usr/bin/chromium
      - CHROMIUM_PATH=/usr/bin/chromium
      - BROWSER_MCP_PORT=8030
    networks:
      - graphiti-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import browser_use; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  neo4j-data:
  neo4j-logs:
  redis-data:
  app-data:
  minio_data:

networks:
  graphiti-network:
    driver: bridge
