services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: graphiti-app
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j123456
      - OPA_URL=http://opa:8181
      - REDIS_URL=redis://redis:6379
    depends_on:
      - neo4j
      - opa
      - redis
    volumes:
      - ..:/app
    restart: unless-stopped

  neo4j:
    image: neo4j:latest
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/neo4j123456
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j-data:/data
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:latest
    container_name: graphiti-opa
    ports:
      - "8181:8181"
    volumes:
      - ../odap/infra/opa/policies:/policies
    command: run --server --log-level=info --set=decision_logs.console=true /policies
    restart: unless-stopped

  redis:
    image: redis:6
    container_name: graphiti-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  neo4j-data:
  redis-data: