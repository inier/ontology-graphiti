[project]
name = "odap"
version = "0.1.0"
description = "ODAP Backend API - FastAPI + Graphiti"
requires-python = ">=3.10"
dependencies = [
    # 图谱
    "neo4j>=5.0.0",
    "networkx>=2.8.0",
    "rank_bm25>=0.2.2",
    # 权限
    "opa-python",
    # Web 框架
    "flask",
    "fastapi",
    "uvicorn",
    # 数据处理
    "pandas",
    "numpy",
    "requests",
    "beautifulsoup4",
    "python-dateutil",
    "jsonpickle",
    "pyyaml>=6.0",
    # 任务队列
    "celery>=5.3.0",
    # Pydantic / HTTP / Auth
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "redis>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.6",
    "openai>=1.0.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.0.0",
    "minio>=7.0.0",
    # DB drivers
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
    # 文档解析
    "PyPDF2>=3.0.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    # 可观测性 — ADR-064
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "prometheus-client>=0.20.0",
    # workspace 依赖（name-only，由根 [tool.uv.sources] 解析）
    "openharness-ai",
    "hyperextract",
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.1.0",
    "faiss-cpu>=1.7.0",
]

[project.optional-dependencies]
graph = ["graphiti-core>=0.28.0"]
crawl4ai = ["crawl4ai>=0.6.0"]
embedder = ["sentence-transformers>=2.2.0"]

[project.scripts]
odap-api = "odap.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["odap"]
