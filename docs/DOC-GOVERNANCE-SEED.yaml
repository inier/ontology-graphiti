# ODAP 文档治理迁移种子（DOC-GOVERNANCE-SEED）
#
# ⚠ 定位声明：本文件是**一次性迁移输入**，不是真相源。
#   迁移脚本把下列判定写入各文档自身的 front-matter 后，本文件即完成历史使命，
#   仅作为「当初为什么这么判」的审计留痕保留（用户要求冗余归档须给溯源证据）。
#   任何后续状态变更**只改文档 front-matter**，不得回改本文件。
#
# 判定优先级（从高到低）：
#   1. overrides 精确路径
#   2. groups 最长前缀匹配
#   3. ADR 状态推导（见 DOC-GOVERNANCE-POLICY.yaml §五）
#   4. layer_defaults 层默认
#
# 裁决原则（本项目总结，供后续复用）：
#   P1 同关注点才谈取代。「总体架构」与「L3-L4 业务层详设」不是同一关注点，
#      462 行的 v2 无法取代 1801 行的分层详设——强行取代等于丢文档。
#   P2 取代需双向证据：被取代方正文自认，或接任方明文声明覆盖范围。
#      仅凭「文件名看起来更新」不构成证据。
#   P3 声称覆盖但实际未覆盖的内容，不得标 superseded。
#      例：UIUX-DESIGN-v2:14 要求把 7 篇 v1 文档标为历史，但 v2 全文无组件 API 层，
#      故 COMPONENT_SPEC.md（10 类组件规格）保留 active，只取代其色彩/动效/导航部分所属的两篇。
#   P4 状态（权威度）与位置（目录）、生命周期（是否维护）三者正交，不可混用。

schema_version: "1.0"
updated: "2026-10-17"

# ─────────────────────────────────────────────────────────────
# 一、前缀分组：同目录同性质的一批文档共用判定
# ─────────────────────────────────────────────────────────────
groups:
  - match: docs/02-architecture/reports/
    status: reference
    lifecycle: historical
    reason: 一次性架构审计/评审/研究报告，结论已并入现行架构文档
    evidence: "docs/02-architecture/README.md 目录说明；文件名含审计日期或 REPORT/AUDIT 标识"

  - match: docs/02-architecture/subsystems/
    status: active
    lifecycle: living
    concern: architecture-subsystem
    reason: 子系统边界与独立化设计，与总体架构不同关注点，仍为实施依据

  - match: docs/superpowers/specs/
    status: reference
    lifecycle: frozen
    reason: superpowers 设计规格存档，结论已落 ADR 或代码，规格本身冻结
    evidence: "docs/07-adr/README.md 各 ADR 的 specs 引用（如 ADR-087 引用 2026-10-07-semantic-drift-detection-design）"

  - match: docs/superpowers/plans/
    status: reference
    lifecycle: historical
    reason: superpowers 实施计划存档，计划已执行，保留为执行留痕
    evidence: "docs/superpowers/specs/ 存在同名 design 文档（spec/plan 成对）"

  - match: docs/00-requirements/archive/
    status: archived
    lifecycle: historical
    reason: 早期需求草案，已被 req-ok.md 定稿承接
    evidence: "docs/00-requirements/README.md 层说明；同目录 req-ok.md 标题为「需求规格说明书（定稿）」"

  - match: docs/00-requirements/backlog/
    status: reference
    lifecycle: historical
    reason: 历史待优化清单，条目已分流至 SPEC-v2 或已裁决关闭
    evidence: "docs/00-requirements/README.md 层说明；文件名日期戳 2026-05-03"

  - match: docs/00-requirements/documents/
    status: reference
    lifecycle: historical
    reason: 阶段性前端实现对照/计划文档，结论已并入 PRD-v2 与 SPEC-v2
    evidence: "docs/00-requirements/README.md 层说明"

