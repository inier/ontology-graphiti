default_provider: openai

providers:
  anthropic:
    enabled: false
    model: claude-3-5-sonnet-20241022
    max_tokens: 4096
    temperature: 0.7

  openai:
    enabled: true
    model: deepseek-ai/deepseek-v4-pro
    max_tokens: 4096
    temperature: 0.7
    base_url: https://integrate.api.nvidia.com/v1

  http:
    enabled: false
    model: deepseek-chat
    max_tokens: 4096
    temperature: 0.7
    base_url: https://api.deepseek.com/v1
