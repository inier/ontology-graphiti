# Agent 配置文件
# 配置 LLM Provider 和 Agent 行为

agent:
  name: "Graphiti Agent"
  version: "2.0.0"
  description: "Graphiti 知识图谱管理系统的智能 Agent"
  
  # Agent Loop 配置
  max_steps: 50
  timeout_seconds: 300
  
  # 决策模式
  decision_mode: "auto"  # auto / llm / fallback
  
  # 思考过程记录
  record_thought_process: true

# LLM Provider 配置
providers:
  # Anthropic Claude
  anthropic:
    enabled: false
    api_key: "${ANTHROPIC_API_KEY}"
    model: "claude-3-sonnet-20240229"
    base_url: "https://api.anthropic.com"
    max_tokens: 4096
    temperature: 0.7
    
  # OpenAI
  openai:
    enabled: false
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4"
    base_url: "https://api.openai.com/v1"
    max_tokens: 4096
    temperature: 0.7
    
  # OpenRouter
  openrouter:
    enabled: false
    api_key: "${OPENROUTER_API_KEY}"
    model: "anthropic/claude-3-sonnet"
    base_url: "https://openrouter.ai/api/v1"
    max_tokens: 4096
    temperature: 0.7
    
  # DeepSeek
  deepseek:
    enabled: false
    api_key: "${DEEPSEEK_API_KEY}"
    model: "deepseek-chat"
    base_url: "https://api.deepseek.com"
    max_tokens: 4096
    temperature: 0.7
    
  # Ollama (本地模型)
  ollama:
    enabled: false
    model: "llama2"
    base_url: "http://localhost:11434"
    max_tokens: 4096
    temperature: 0.7

# 默认 Provider
default_provider: "anthropic"

# 工具配置
tools:
  # 图谱工具
  graph:
    enabled: true
    tools:
      - query_entities
      - query_relations
      - analyze_graph
      - search_graph
      - get_entity_details
      
  # 工作空间工具
  workspace:
    enabled: true
    tools:
      - list_workspaces
      - get_workspace_info
      - create_workspace_summary
      
  # 情报工具
  intelligence:
    enabled: true
    tools:
      - search_radar
      - analyze_domain

# 权限配置
permissions:
  # 是否需要 OPA 检查
  opa_check: false
  
  # 允许的工具类别
  allowed_categories:
    - graph
    - workspace
    - intelligence
    - analysis
    
  # 禁止的工具
  forbidden_tools: []

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/agent.log"
